<article class="card kpi-card h-100">
    <div class="card-body">
        <div class="kpi-heading"><span class="kpi-icon kpi-icon-{{ tone }}"><i class="bi bi-{{ icon }}" aria-hidden="true"></i></span><h2>{{ label }}</h2></div>
        <div class="kpi-value-row"><strong>{{ value }}{% if suffix %}<span>{{ suffix }}</span>{% endif %}</strong>{% if badge %}<span class="kpi-caption">{{ badge }}</span>{% endif %}</div>
        <p>{{ description }}</p>
    </div>
</article>

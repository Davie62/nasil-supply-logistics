{% if server_search %}<form method="get" class="workflow-toolbar flex-wrap" role="search"><div class="table-search"><label class="visually-hidden" for="workflow-search">Search {{ title|lower }}</label><input class="form-control" id="workflow-search" name="q" type="search" maxlength="150" value="{{ search_term }}" placeholder="Search {{ title|lower }}..."></div>{% if filter_choices %}<div><label for="list-status" class="visually-hidden">Status</label><select id="list-status" name="status" class="form-control"><option value="">All statuses</option>{% for value,label in filter_choices %}<option value="{{ value }}"{% if value == selected_status %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}{% if request.GET.overdue %}<input type="hidden" name="overdue" value="{{ request.GET.overdue }}">{% endif %}{% if request.GET.unread %}<input type="hidden" name="unread" value="{{ request.GET.unread }}">{% endif %}<button class="workflow-button" type="submit">Search</button><a class="workflow-button secondary" href="{{ request.path }}">Reset</a><span class="small text-secondary">{{ page_obj.paginator.count }} result{{ page_obj.paginator.count|pluralize }}</span></form>{% else %}<div class="workflow-toolbar"><div class="table-search"><label class="visually-hidden" for="workflow-search">Search {{ title|lower }}</label><input class="form-control" id="workflow-search" type="search" placeholder="Search {{ title|lower }}..." data-table-search="workflow-records"></div><span class="table-result-count" data-table-count="workflow-records" aria-live="polite">{{ rows|length }} records</span></div>{% endif %}

{% extends 'base.html' %}

{% block title %}Staff Login - NASIL{% endblock %}

{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #0f172e 0%, #18aee8 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-container {
        max-width: 450px;
        width: 100%;
        margin: auto;
        padding: 20px;
    }

    .login-card {
        background: var(--white);
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(15, 23, 46, 0.2);
        overflow: hidden;
    }

    .login-header {
        background: linear-gradient(135deg, #0f172e 0%, #ff6b5b 100%);
        color: var(--white);
        padding: 40px 30px;
        text-align: center;
    }

    .login-header h2 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
    }

    .login-body {
        padding: 40px 30px;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-label {
        display: block;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 8px;
        font-size: 14px;
    }

    .form-input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
        transition: all 0.3s ease;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(255, 107, 91, 0.1);
    }

    .checkbox-group {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
    }

    .checkbox-input {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--accent);
    }

    .checkbox-label {
        margin-left: 8px;
        color: var(--text-secondary);
        font-size: 14px;
        cursor: pointer;
    }

    .login-button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #0f172e 0%, #ff6b5b 100%);
        color: var(--white);
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(255, 107, 91, 0.3);
    }

    .alert {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 24px;
        font-size: 14px;
    }

    .alert-danger {
        background: #fee2e2;
        color: #991b1b;
        border-left: 4px solid #dc2626;
    }
</style>

<div class="login-container">

    <div class="login-card">

        <div class="login-header">
            <h2>NASIL Staff Portal</h2>
            <p style="margin: 8px 0 0; opacity: 0.9; font-size: 14px;">Secure Login</p>
        </div>

        <div class="login-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input
                        type="text"
                        name="username"
                        class="form-input"
                        placeholder="Enter your username"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="checkbox-group">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember_me"
                        class="checkbox-input"
                    >
                    <label for="remember" class="checkbox-label">Remember Me</label>
                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}

<div class="portal-table-wrap"><table class="table align-middle"><caption class="visually-hidden">Your shipments</caption><thead><tr><th>Tracking ID</th><th>Status</th><th>Estimated delivery</th><th></th></tr></thead><tbody>{% for shipment in shipments %}<tr><td><a class="portal-reference" href="{% url 'portal_shipment' shipment.pk %}">{{ shipment.tracking_number }}</a></td><td>{{ shipment.get_status_display }}</td><td>{{ shipment.estimated_delivery|date:"d M Y"|default:"Not scheduled" }}</td><td><a href="{% url 'portal_shipment' shipment.pk %}">Details</a></td></tr>{% empty %}<tr><td colspan="4">No shipments found.</td></tr>{% endfor %}</tbody></table></div>

name: Security checks
on:
  pull_request:
  push:
    branches: [development, main, master]
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_DB_ENGINE: 'postgresql'
      POSTGRES_DB: 'nasil'
      POSTGRES_USER: 'nasil'
      POSTGRES_PASSWORD: 'nasil'
      POSTGRES_HOST: '127.0.0.1'
      POSTGRES_PORT: '5432'
      POSTGRES_SSLMODE: 'disable'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
      HEALTHCHECK_BROKER: 'true'
      NOTIFICATIONS_DELIVERY_ENABLED: 'false'
      INTEGRATIONS_DELIVERY_ENABLED: 'false'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nasil
          POSTGRES_USER: nasil
          POSTGRES_PASSWORD: nasil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nasil -d nasil"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-development.txt
      - run: python -m ruff check .
      - run: python scripts/security_scan.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m coverage run manage.py test --noinput
      - run: python -m coverage report
      - run: python -m pip_audit --vulnerability-service osv --timeout 60
  security:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DJANGO_DEBUG: 'true'
      NOTIFICATIONS_DELIVERY_ENABLED: 'false'
      INTEGRATIONS_DELIVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-development.txt
      - run: python -m ruff check .
      - run: python scripts/security_scan.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python -m pip_audit --vulnerability-service osv --timeout 60

# Local development stack: PostgreSQL, Redis, Django and Celery.
# This runs with DJANGO_DEBUG=true and plain HTTP. Production requires the
# TLS/HTTPS settings documented in DEPLOYMENT.md and .env.example.
name: nasil

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nasil
      POSTGRES_USER: nasil
      POSTGRES_PASSWORD: nasil-local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasil -d nasil"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: python manage.py migrate --noinput
    environment: &app_env
      DJANGO_DEBUG: "true"
      DJANGO_DB_ENGINE: postgresql
      POSTGRES_DB: nasil
      POSTGRES_USER: nasil
      POSTGRES_PASSWORD: nasil-local-only
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
      HEALTHCHECK_BROKER: "true"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment: *app_env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    command: celery -A backend worker --loglevel=info
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A backend beat --loglevel=info
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
